[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-clerk-research-engine"
version = "0.1.0"
description = "Evidence-first SBI Clerk paper research, validation, and pattern analysis"
requires-python = ">=3.11"

[project.scripts]
sbi-research = "sbi_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
